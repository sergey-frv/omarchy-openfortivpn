# Drop-in for openfortivpn@.service: SAML login for the profile /etc/openfortivpn/<profile>.conf.
# Install as /etc/systemd/system/openfortivpn@.service.d/saml.conf.
#
# %i instead of the packaged %I: %I unescapes "-" to "/", so openfortivpn@work-old.service would read
# /etc/openfortivpn/work/old.conf. With %i the unit is named after the profile as is.
[Unit]
Description=OpenFortiVPN for %i

# saml-login is accepted only on the command line, not in the config file, so ExecStart is replaced.
# openfortivpn sends READY=1 right after "Tunnel is up and running.", so the unit is active and
# ExecStartPost runs only once the tunnel is up. TimeoutStartSec bounds the wait for the browser login.
# Restart=no: a restart would start a new SAML login nobody waits for.
[Service]
ExecStart=
ExecStart=/usr/bin/openfortivpn -c /etc/openfortivpn/%i.conf --saml-login
Restart=no
TimeoutStartSec=5min
# Send all DNS lookups to the VPN interface; the setting disappears together with ppp0
ExecStartPost=-/usr/bin/resolvectl domain ppp0 ~.
